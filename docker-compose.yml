version: "3.8"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8011:8011"
    env_file:
      - .env
    volumes:
      - opsbrain_data:/app/data     # persist SQLite across deploys
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8011}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8011}
    ports:
      - "3010:3010"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opsbrain_data:
    driver: local
