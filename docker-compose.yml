version: "3.8"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8011:8011"
    env_file:
      - .env
    volumes:
      - opsbrain_data:/app/data
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opsbrain-backend.rule=Host(`${VPS_DOMAIN}`) && (PathPrefix(`/api/`) || PathPrefix(`/auth/`) || PathPrefix(`/setup/`) || PathPrefix(`/health`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.opsbrain-backend.entrypoints=websecure"
      - "traefik.http.routers.opsbrain-backend.tls=true"
      - "traefik.http.routers.opsbrain-backend.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.opsbrain-backend.priority=100"
      - "traefik.http.services.opsbrain-backend.loadbalancer.server.port=8011"
      - "traefik.docker.network=traefik-public"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=
        - NEXT_PUBLIC_WS_URL=
    ports:
      - "3010:3010"
    environment:
      - BACKEND_URL=http://backend:8011
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opsbrain-frontend.rule=Host(`${VPS_DOMAIN}`)"
      - "traefik.http.routers.opsbrain-frontend.entrypoints=websecure"
      - "traefik.http.routers.opsbrain-frontend.tls=true"
      - "traefik.http.routers.opsbrain-frontend.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.opsbrain-frontend.priority=10"
      - "traefik.http.services.opsbrain-frontend.loadbalancer.server.port=3010"
      - "traefik.docker.network=traefik-public"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opsbrain_data:
    driver: local

networks:
  default:
  traefik-public:
    external: true
