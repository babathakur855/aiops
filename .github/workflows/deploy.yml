name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e

            DEPLOY_PATH="/root/use-cases/aiops"
            REPO="https://github.com/babathakur855/aiops.git"
            VPS_HOST="${{ secrets.VPS_HOST }}"
            VPS_DOMAIN="${{ secrets.VPS_DOMAIN }}"

            # ── Clone or pull ──────────────────────────────────────────────
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "==> First deploy: cloning repo..."
              mkdir -p "$DEPLOY_PATH"
              git clone "$REPO" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ── Build .env ─────────────────────────────────────────────────
            if [ ! -f .env ]; then
              if [ -f /root/use-cases/.env.common ]; then
                echo "==> Copying shared .env.common..."
                cp /root/use-cases/.env.common .env
              else
                echo "==> Creating blank .env..."
                touch .env
              fi
            fi

            # Inject secrets into .env
            grep -q "^VPS_DOMAIN=" .env && \
              sed -i "s|^VPS_DOMAIN=.*|VPS_DOMAIN=${VPS_DOMAIN}|" .env || \
              echo "VPS_DOMAIN=${VPS_DOMAIN}" >> .env

            grep -q "^ANTHROPIC_API_KEY=" .env && \
              sed -i "s|^ANTHROPIC_API_KEY=.*|ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}|" .env || \
              echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env

            echo "==> .env configured:"
            grep -E "^VPS_DOMAIN=|^ANTHROPIC_API_KEY" .env | sed 's/=.*/=***/'

            # ── Traefik network ────────────────────────────────────────────
            echo "==> Ensuring traefik-public network exists..."
            docker network create traefik-public 2>/dev/null || true
            docker network connect traefik-public root-traefik-1 2>/dev/null || true

            # ── Build and deploy ───────────────────────────────────────────
            echo "==> Building containers (3-5 min on first run)..."
            docker compose build --no-cache frontend
            docker compose build backend

            echo "==> Starting services..."
            docker compose up -d

            docker image prune -f

            # ── Health checks ──────────────────────────────────────────────
            echo "==> Waiting for services to be healthy..."
            sleep 20

            docker compose ps

            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8011/health > /dev/null 2>&1; then
                echo "✅ Backend healthy"
                break
              fi
              echo "   Waiting for backend... ($i/5)"
              sleep 10
            done

            for i in 1 2 3; do
              if curl -sf http://localhost:3010 > /dev/null 2>&1; then
                echo "✅ Frontend healthy"
                break
              fi
              echo "   Waiting for frontend... ($i/3)"
              sleep 15
            done

            echo ""
            echo "════════════════════════════════════════════════"
            echo "  ✅ DEPLOYED: OpsBrain AIOps Platform"
            echo "  Site     : https://${VPS_DOMAIN}"
            echo "  API Docs : https://${VPS_DOMAIN}/docs"
            echo "  Frontend : http://${VPS_HOST}:3010  (direct)"
            echo "  Backend  : http://${VPS_HOST}:8011  (direct)"
            echo "════════════════════════════════════════════════"

  summary:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Write job summary
        run: |
          STATUS="${{ needs.deploy.result }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          echo "## $EMOJI OpsBrain Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status   | \`$STATUS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch   | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit   | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Site     | \`https://${{ secrets.VPS_DOMAIN }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API Docs | \`https://${{ secrets.VPS_DOMAIN }}/docs\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`http://${{ secrets.VPS_HOST }}:3010\` (direct) |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | \`http://${{ secrets.VPS_HOST }}:8011\` (direct) |" >> $GITHUB_STEP_SUMMARY
