name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 25m
          script: |
            set -e

            DEPLOY_PATH="/root/use-cases/aiops"
            REPO="https://github.com/babathakur855/aiops.git"
            VPS_HOST="${{ secrets.VPS_HOST }}"

            # ── Clone or pull ──────────────────────────────────────────────
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "==> First deploy: cloning repo..."
              mkdir -p "$DEPLOY_PATH"
              git clone "$REPO" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # ── Build .env ─────────────────────────────────────────────────
            # Start from shared .env.common if project .env is missing
            if [ ! -f .env ]; then
              if [ -f /root/use-cases/.env.common ]; then
                echo "==> Copying shared .env.common..."
                cp /root/use-cases/.env.common .env
              else
                echo "==> Creating blank .env..."
                touch .env
              fi
            fi

            # Ensure NEXT_PUBLIC_API_URL uses VPS public IP (browser-accessible)
            grep -q "^NEXT_PUBLIC_API_URL=" .env && \
              sed -i "s|^NEXT_PUBLIC_API_URL=.*|NEXT_PUBLIC_API_URL=http://${VPS_HOST}:8011|" .env || \
              echo "NEXT_PUBLIC_API_URL=http://${VPS_HOST}:8011" >> .env

            grep -q "^NEXT_PUBLIC_WS_URL=" .env && \
              sed -i "s|^NEXT_PUBLIC_WS_URL=.*|NEXT_PUBLIC_WS_URL=ws://${VPS_HOST}:8011|" .env || \
              echo "NEXT_PUBLIC_WS_URL=ws://${VPS_HOST}:8011" >> .env

            echo "==> .env configured:"
            grep -E "^NEXT_PUBLIC_|^ANTHROPIC_API_KEY" .env | sed 's/=.*/=***/'

            # ── Build and deploy ───────────────────────────────────────────
            echo "==> Building containers (this takes 3-5 min on first run)..."
            docker compose build

            echo "==> Starting services..."
            docker compose up -d

            # Remove dangling images to free disk space
            docker image prune -f

            # ── Health checks ──────────────────────────────────────────────
            echo "==> Waiting for services to be healthy..."
            sleep 20

            docker compose ps

            # Backend health
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8011/health > /dev/null 2>&1; then
                echo "✅ Backend healthy"
                break
              fi
              echo "   Waiting for backend... ($i/5)"
              sleep 10
            done

            # Frontend health
            for i in 1 2 3; do
              if curl -sf http://localhost:3010 > /dev/null 2>&1; then
                echo "✅ Frontend healthy"
                break
              fi
              echo "   Waiting for frontend... ($i/3)"
              sleep 15
            done

            echo ""
            echo "════════════════════════════════════════════════"
            echo "  ✅ DEPLOYED: OpsBrain AIOps Platform"
            echo "  Frontend : http://${VPS_HOST}:3010"
            echo "  Backend  : http://${VPS_HOST}:8011"
            echo "  API Docs : http://${VPS_HOST}:8011/docs"
            echo "════════════════════════════════════════════════"

  summary:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Write job summary
        run: |
          STATUS="${{ needs.deploy.result }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          echo "## $EMOJI OpsBrain Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status   | \`$STATUS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch   | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit   | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`http://VPS_HOST:3010\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend  | \`http://VPS_HOST:8011\` |" >> $GITHUB_STEP_SUMMARY
          echo "| API Docs | \`http://VPS_HOST:8011/docs\` |" >> $GITHUB_STEP_SUMMARY
