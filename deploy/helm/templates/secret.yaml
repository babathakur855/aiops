{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opsbrain.fullname" . }}-secret
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ .Values.auth.jwtSecretKey | quote }}
  APP_SECRET_KEY: {{ .Values.app.env | quote }}
  {{- if eq .Values.llm.provider "anthropic" }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropic.apiKey | quote }}
  {{- end }}
  {{- if eq .Values.llm.provider "azure_openai" }}
  AZURE_OPENAI_API_KEY: {{ .Values.llm.azureOpenAI.apiKey | quote }}
  {{- end }}
  {{- if .Values.connectors.serviceNow.enabled }}
  SNOW_PASSWORD: {{ .Values.connectors.serviceNow.password | quote }}
  {{- end }}
  {{- if .Values.connectors.confluence.enabled }}
  CONFLUENCE_API_TOKEN: {{ .Values.connectors.confluence.apiToken | quote }}
  {{- end }}
  {{- if .Values.connectors.dynatrace.enabled }}
  DYNATRACE_API_TOKEN: {{ .Values.connectors.dynatrace.apiToken | quote }}
  {{- end }}
  {{- if .Values.connectors.elasticsearch.enabled }}
  ELASTICSEARCH_API_KEY: {{ .Values.connectors.elasticsearch.apiKey | quote }}
  {{- end }}
  {{- if .Values.connectors.slack.enabled }}
  SLACK_WEBHOOK_URL: {{ .Values.connectors.slack.webhookUrl | quote }}
  SLACK_BOT_TOKEN: {{ .Values.connectors.slack.botToken | quote }}
  {{- end }}
  {{- if .Values.connectors.email.enabled }}
  SMTP_PASSWORD: {{ .Values.connectors.email.password | quote }}
  {{- end }}
{{- end }}
